baseURL = "https://ridhimanehra96.github.io/ai/"
title = "Ridhima Nehra"
theme = "PaperMod"
defaultContentLanguage = "en"

[languages.en]
languageName = "English"
weight = 1

[pagination]
pagerSize = 5

[params]
author = "Ridhima Nehra"
description = "PhD Student in Mathematics at North Dakota State University"
defaultTheme = "dark"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowFullTextinRSS = true
editPost.URL = "https://github.com/ridhimanehra96-ai/ridhimanehra96-ai/blob/main/content"
editPost.Text = "Suggest Changes"
editPost.appendFilePath = true

[params.homeInfoParams]
Title = "Hi, I'm Ridhima Nehra 👋"
Content = """\
PhD Student in **Mathematics** at [North Dakota State University](https://www.ndsu.edu/).\
<br><br>\
Research in pure and applied mathematics, mathematical modeling, and computational methods.\
<br><br>\
Welcome to my personal corner where I share my research, thoughts on math, and occasional musings.\
"""

[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/ridhimanehra96-ai"

[[params.socialIcons]]
name = "email"
title = "Email"
url = "mailto:ridhima.nehra@ndsu.edu"

[[params.socialIcons]]
name = "scholar"
title = "Google Scholar"
url = "https://scholar.google.com"

[params.assets]
favicon = "/favicon.ico"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 1

