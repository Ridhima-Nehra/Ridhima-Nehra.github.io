baseURL = "https://ridhima-nehra.github.io/"
title = "Ridhima Nehra"
theme = "PaperMod"
defaultContentLanguage = "en"

[languages.en]
languageName = "English"
weight = 1

[pagination]
pagerSize = 5

[params]
author = "Ridhima Nehra"
description = "PhD Student in Mathematics at North Dakota State University"
defaultTheme = "dark"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = false
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowFullTextinRSS = true
editPost.URL = "https://github.com/Ridhima-Nehra/Ridhima-Nehra.github.io/blob/main/content" 
editPost.Text = "Suggest Changes"
editPost.appendFilePath = true

[params.homeInfoParams]
Content = """\
<img src="/profile_pic.jpg" alt="Ridhima Nehra" width="300" height="280" style="display:block; margin:0 auto 25px; border-radius:50%; object-fit:cover; padding-top:15px;">\
<br><br>\
Hello. I'm Ridhima Nehra. PhD Student in **Mathematics** at [North Dakota State University](https://www.ndsu.edu/).\
<br><br>\
Welcome to my personal corner where I share my research, thoughts on math, and photography.\
<br><br>\
My research interests include Financial Mathematics, Mathematical Modeling, Computational Methods and Applied Mathematics.\
<br><br>\
"""

